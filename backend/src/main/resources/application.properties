# ========================
# APPLICATION PROPERTIES
# ========================

# App Name
spring.application.name=AI Interview Simulator

# Server Port
server.port=8080

# ========================
# MongoDB Configuration
# ========================
spring.data.mongodb.uri=mongodb://localhost:27017/ai_interview_db

# ========================
# JWT Configuration
# ========================
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenGenerationMinimum256BitsRequired2026!@#
jwt.expiration=86400000

# ========================
# Static Resources (Frontend)
# ========================
spring.web.resources.static-locations=file:frontend/,classpath:/static/

# ========================
# File Upload Size
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# Logging
# ========================
logging.level.com.interviewer=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
server.error.include-message=always
server.error.include-exception=true
